<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICON 數字跳動（分開模組）</title>
  <style>
    :root {
      --brand:#0AC290;
      --ink:#222;
      --muted:#6b7280;
      --card-bg:#ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; padding:32px;
      font-family: ui-sans-serif, -apple-system, "Microsoft JhengHei", "Noto Sans TC", system-ui;
      background:#f7f7f8;
      color:var(--ink);
      display:flex; flex-wrap:wrap; gap:20px; align-items:stretch; justify-content:center;
    }
    .counter-card {
      display:flex; align-items:center; gap:16px;
      padding:18px 22px;
      background:var(--card-bg);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      min-width: 280px;
    }
    .icon-wrap {
      width:72px; height:72px; flex:0 0 72px;
      display:grid; place-items:center;
      border-radius:16px;
      background:rgba(10,194,144,.08);
    }
    .icon-wrap img { width:48px; height:48px; display:block; }
    .stat { line-height:1.1; }
    .label { font-size:14px; color:var(--muted); margin-bottom:4px; }
    .value { font-size:42px; font-weight:800; color:var(--brand); display:flex; align-items:baseline; gap:8px; }
    .unit { font-size:18px; font-weight:700; color:#2e2e2e; }
    /* Helpers to separate modules visually */
    .section-title { width:100%; font-weight:800; margin:6px 4px 0; color:#555; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  
    .counter-card {
      flex:1 1 300px;
      max-width: 320px;
    }

  </style>
</head>
