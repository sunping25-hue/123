name: ShinoX lead form tests
on:
  push:
    branches: [shinox-v2-hero]
    paths:
      - 'server.py'
      - 'production_api.py'
      - 'legal_policy.py'
      - 'shinox-v2-site/legal-config.json'
      - 'tests/**'
      - '.github/workflows/lead-tests.yml'
  pull_request:
    paths:
      - 'server.py'
      - 'production_api.py'
      - 'legal_policy.py'
      - 'shinox-v2-site/legal-config.json'
      - 'tests/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q server.py production_api.py tests
      - name: Integration tests (synthetic data and mock SMTP)
        run: python -m unittest discover -s tests -v
